apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-service
  namespace: payment-system
  labels:
    app: fraud-detection-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fraud-detection-service
  template:
    metadata:
      labels:
        app: fraud-detection-service
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -qO- http://eureka-server:8761/actuator/health | grep -q "UP"; do echo "Waiting for Eureka..."; sleep 5; done']
      containers:
        - name: fraud-detection-service
          image: harsh12215211/fraud-detection-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7508
          env:
            - name: EUREKA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: PORT
              value: "7508"
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /docs
              port: 7508
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /docs
              port: 7508
            initialDelaySeconds: 40
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
  namespace: payment-system
spec:
  selector:
    app: fraud-detection-service
  ports:
    - protocol: TCP
      port: 7508
      targetPort: 7508
  type: ClusterIP
