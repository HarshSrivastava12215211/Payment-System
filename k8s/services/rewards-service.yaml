apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewards-service
  namespace: payment-system
  labels:
    app: rewards-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rewards-service
  template:
    metadata:
      labels:
        app: rewards-service
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z rabbitmq 5672; do echo "Waiting for RabbitMQ..."; sleep 5; done']
        - name: wait-for-config
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -qO- http://config-server:7512/actuator/health | grep -q "UP"; do echo "Waiting for Config Server..."; sleep 5; done']
      containers:
        - name: rewards-service
          image: harsh12215211/rewards-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7511
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: DB_PORT
            - name: DB_NAME
              value: "rewards_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: DB_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: SPRING_RABBITMQ_PORT
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: SPRING_CONFIG_IMPORT
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "rewards-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 7511
            initialDelaySeconds: 180
            timeoutSeconds: 15
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 7511
            initialDelaySeconds: 180
            timeoutSeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rewards-service
  namespace: payment-system
spec:
  selector:
    app: rewards-service
  ports:
    - protocol: TCP
      port: 7511
      targetPort: 7511
  type: ClusterIP
