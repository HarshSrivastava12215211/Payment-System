apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: payment-system
data:
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:7512"
