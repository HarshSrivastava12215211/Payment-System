apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payment-system
  labels:
    app: api-gateway
  annotations:
    # AWS ALB Ingress will target this service; we keep it ClusterIP
    # and expose externally via Ingress resource
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 7505
      targetPort: 7505
  type: ClusterIP
