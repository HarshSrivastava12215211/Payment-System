spring.application.name=Admin-Service
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://localhost:7512

server.port=7501

jwt.secret=mysupersecretkeymysupersecretkeymysupersecretkey

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

server.forward-headers-strategy=framework

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# API Docs# SWAGGER
springdoc.api-docs.path=/admin/v3/api-docs

logging.file.name=logs/admin-service.log
logging.level.root=INFO
logging.level.com.admin=DEBUG

# MONITORING & METRICS
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
