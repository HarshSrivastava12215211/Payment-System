spring.application.name=Api-Gateway
spring.config.import=optional:configserver:http://localhost:7512

# Server Port
server.port=7505

# Eureka Config
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=7505

# Enable service discovery for Gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# ===========================
# ROUTES CONFIGURATION
# ===========================

# AUTH (USER SERVICE)
spring.cloud.gateway.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# ADMIN SERVICE
spring.cloud.gateway.routes[1].id=ADMIN-SERVICE
spring.cloud.gateway.routes[1].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/admin/**

# KYC SERVICE
spring.cloud.gateway.routes[2].id=KYC-SERVICE
spring.cloud.gateway.routes[2].uri=lb://KYC-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/kyc/**

# PAYMENT SERVICE
spring.cloud.gateway.routes[3].id=PAYMENT-SERVICES
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICES
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**

# WALLET SERVICE
spring.cloud.gateway.routes[4].id=WALLET-SERVICE
spring.cloud.gateway.routes[4].uri=lb://Wallet-Service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/wallets/**

# TRANSACTION SERVICE
spring.cloud.gateway.routes[5].id=TRANSACTION-SERVICE
spring.cloud.gateway.routes[5].uri=lb://Transaction-Service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/transaction/**

# REWARDS SERVICE
spring.cloud.gateway.routes[6].id=REWARDS-SERVICE
spring.cloud.gateway.routes[6].uri=lb://REWARDS-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/rewards/**

# NOTIFICATION SERVICE
spring.cloud.gateway.routes[7].id=NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**

# USER SERVICE
spring.cloud.gateway.routes[8].id=USER-SERVICE
spring.cloud.gateway.routes[8].uri=lb://user-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/users/**

# FRAUD-DETECTION-SERVICE
spring.cloud.gateway.routes[9].id=FRAUD-DETECTION-SERVICE
spring.cloud.gateway.routes[9].uri=lb://FRAUD-DETECTION-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/fraud/**

# CHATBOT-SERVICE
spring.cloud.gateway.routes[10].id=CHATBOT-SERVICE
spring.cloud.gateway.routes[10].uri=lb://CHATBOT-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/chatbot/**

# ===========================
# CORS CONFIGURATION (Now handled via CorsConfig.java)
# ===========================
server.forward-headers-strategy=framework


# ===========================
# SWAGGER AGGREGATION
# ===========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/users/v3/api-docs
springdoc.swagger-ui.urls[1].name=Admin Service
springdoc.swagger-ui.urls[1].url=/admin/v3/api-docs
springdoc.swagger-ui.urls[2].name=KYC Service
springdoc.swagger-ui.urls[2].url=/api/kyc/v3/api-docs
springdoc.swagger-ui.urls[3].name=Payment Service
springdoc.swagger-ui.urls[3].url=/api/payments/v3/api-docs
springdoc.swagger-ui.urls[4].name=Wallet Service
springdoc.swagger-ui.urls[4].url=/api/wallets/v3/api-docs
springdoc.swagger-ui.urls[5].name=Transaction Service
springdoc.swagger-ui.urls[5].url=/api/transaction/v3/api-docs
springdoc.swagger-ui.urls[6].name=Rewards Service
springdoc.swagger-ui.urls[6].url=/api/rewards/v3/api-docs
springdoc.swagger-ui.urls[7].name=Notification Service
springdoc.swagger-ui.urls[7].url=/api/notifications/v3/api-docs

logging.file.name=logs/api-gateway.log
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# MONITORING & METRICS
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
