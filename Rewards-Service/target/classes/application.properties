spring.application.name=Rewards-Service
# SWAGGER
springdoc.api-docs.path=/api/rewards/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://localhost:7512

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=7511

eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

server.forward-headers-strategy=framework

# Rewards Config
rewards.default.points-per-unit=1
rewards.default.unit-amount=100
rewards.points.expiry-days=365
rewards.tier.silver-max=999
rewards.tier.gold-max=4999

logging.file.name=logs/rewards-service.log
logging.level.root=INFO
logging.level.com.rewards=DEBUG

# MONITORING & METRICS
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}


# RESILIENCE4J CONFIGURATION
# Circuit Breaker
resilience4j.circuitbreaker.instances.rewardService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.rewardService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.rewardService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.rewardService.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.rewardService.permittedNumberOfCallsInHalfOpenState=2



