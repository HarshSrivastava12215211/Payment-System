name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-southeast-1           # ← Change to your AWS region
  EKS_CLUSTER_NAME: payment-cluster    # ← Change to your EKS cluster name

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Build & Push Microservices
  # ─────────────────────────────────────────────────────────────
  build-microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: Admin-Service
            image: admin-service
          - dir: Api-Gateway
            image: api-gateway
          - dir: Config-Servier
            image: config-server
          - dir: Eureka-Server
            image: eureka-server
          - dir: KYC-Services
            image: kyc-service
          - dir: Notification-Service
            image: notification-service
          - dir: Payment-Services
            image: payment-service
          - dir: Rewards-Service
            image: rewards-service
          - dir: Transaction-Service
            image: transaction-service
          - dir: User-Service
            image: user-service
          - dir: Wallet-Service
            image: wallet-service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: |
        cd ${{ matrix.dir }}
        mvn clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        cd ${{ matrix.dir }}
        docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest \
                     -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  #  Build & Push Frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Frontend Docker Image
      run: |
        cd frontend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest \
                     -t ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  #  Deploy to AWS EKS  (only on push to main, not PRs)
  # ─────────────────────────────────────────────────────────────
  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: [build-microservices, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name   ${{ env.EKS_CLUSTER_NAME }}

    - name: Apply Namespace & Config
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml

    - name: Apply Secrets
      run: |
        # Populate the secret from GitHub Secrets at deploy time
        kubectl create secret generic payment-secrets \
          --namespace payment-system \
          --from-literal=DB_HOST="${{ secrets.RDS_ENDPOINT }}" \
          --from-literal=DB_USERNAME="${{ secrets.DB_USERNAME }}" \
          --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --from-literal=RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}" \
          --from-literal=RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
          --from-literal=RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy Infrastructure (RabbitMQ, Eureka, Config Server)
      run: |
        kubectl apply -f k8s/rabbitmq/
        kubectl apply -f k8s/eureka/
        kubectl apply -f k8s/config-server/
        # Wait for Eureka and Config Server to be ready
        kubectl rollout status deployment/eureka-server   -n payment-system --timeout=120s
        kubectl rollout status deployment/config-server   -n payment-system --timeout=120s

    - name: Deploy API Gateway
      run: |
        kubectl apply -f k8s/api-gateway/
        kubectl rollout status deployment/api-gateway -n payment-system --timeout=120s

    - name: Deploy All Microservices
      run: |
        kubectl apply -f k8s/services/
        for svc in user-service admin-service kyc-service wallet-service \
                   payment-service transaction-service notification-service rewards-service; do
          kubectl rollout status deployment/$svc -n payment-system --timeout=180s
        done

    - name: Deploy Frontend
      run: |
        kubectl apply -f k8s/frontend/
        kubectl rollout status deployment/frontend -n payment-system --timeout=60s

    - name: Apply Ingress
      run: |
        kubectl apply -f k8s/ingress.yaml

    - name: Force rolling image update (use the new sha tag)
      run: |
        IMAGES=(admin-service api-gateway config-server eureka-server kyc-service \
                notification-service payment-service rewards-service transaction-service \
                user-service wallet-service)
        for img in "${IMAGES[@]}"; do
          kubectl set image deployment/$img $img=${{ secrets.DOCKER_USERNAME }}/$img:${{ github.sha }} \
            -n payment-system --record || true
        done
        kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }} \
          -n payment-system --record || true

    - name: Verify cluster health
      run: |
        echo "=== Pods ==="
        kubectl get pods -n payment-system
        echo "=== Services ==="
        kubectl get svc -n payment-system
        echo "=== Ingress ==="
        kubectl get ingress -n payment-system
