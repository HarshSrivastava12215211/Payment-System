name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Build all Maven services
      run: |
        services=("Admin-Service" "Api-Gateway" "Config-Servier" "Eureka-Server" "KYC-Services" "Notification-Service" "Payment-Services" "Rewards-Service" "Transaction-Service" "User-Service" "Wallet-Service")
        for service in "${services[@]}"; do
          echo "Building $service..."
          (cd $service && mvn clean package -DskipTests)
        done

    - name: Build Angular Frontend
      run: |
        cd frontend
        npm install
        npm run build -- --configuration=production

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Images
      run: |
        docker compose build
        docker compose push
