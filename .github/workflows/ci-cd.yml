name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: Admin-Service
            image: admin-service
          - dir: Api-Gateway
            image: api-gateway
          - dir: Config-Servier
            image: config-server
          - dir: Eureka-Server
            image: eureka-server
          - dir: KYC-Services
            image: kyc-service
          - dir: Notification-Service
            image: notification-service
          - dir: Payment-Services
            image: payment-service
          - dir: Rewards-Service
            image: rewards-service
          - dir: Transaction-Service
            image: transaction-service
          - dir: User-Service
            image: user-service
          - dir: Wallet-Service
            image: wallet-service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: |
        cd ${{ matrix.dir }}
        mvn clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        cd ${{ matrix.dir }}
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Frontend Docker Image
      run: |
        cd frontend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
